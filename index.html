*{box-sizing:border-box}html,body{margin:0}

@media print{@page{size:A4 landscape;margin:0}#banner,button,.noprint{display:none!important}body{background:#fff;padding:0}#cert{-webkit-print-color-adjust:exact;print-color-adjust:exact}}

const LESSONS={1:[["دينزمور وبيلي","بعث القنصل لي دينزمور تقريره في تشرين الثاني/نوفمبر 1968 ووصف الشيخ زايد بأنه «عربي من الصحراء». وقبله بأكثر من قرن (1863) رصد المبعوث لويس بيلي انطباعاته ورأى أن الظروف الطبيعية شكّلت صفات العرب.","ص23–24"],["العناصر الثلاثة","تشكّل مجتمع البدو من ثلاثة عناصر: طبيعة المكان، والبنية السياسية (القبيلة والزعامة)، والبنية الأخلاقية (مبدأ الشرف).","ص27"],["القبلية والتكيف","القبلية رابطة إيجابية تمنح القوة والتماسك، وثقافة القبيلة المرنة مكّنت شعوب الخليج من استيعاب التطور الجديد خلال جيل واحد.","ص26"],["الشرف","يتجسد الشرف في الضيافة والكرم والصدق والعفة والإيثار وحرمة الضيف والشهامة والشجاعة، وفقدانه «موت اجتماعي».","ص37"],["بنو ياس وآل نهيان","ليوا الموطن الأصلي لبني ياس، واختير شيخهم من آل نهيان لأنهم اعتبروا من أهل الكفاءة وأصحاب الشرف. وقام مجلس التعاون عام 1981.","ص31، 41، 51"]],
2:[["مراجعة المواقع والتواريخ","ليوا الموطن الأصلي لبني ياس، والعين وصلتها المياه العذبة من الجبال، وزركوه جزيرة فيها أطلال حصن أوربي، والربع الخالي «بحر الرمال». وانظر تواريخ 1833 و1948 و1968 و1981.","ص23–51"],["أنماط المعيشة","تنقسم القبائل إلى برية (ماشية وواحات) وبحرية (صيد وغوص وتجارة بحرية)، وبنو ياس يندرجون في الفئتين.","ص32"]],
3:[["سلطة الشيخ","سلطة الشيخ سياسية في جوهرها، قامت على توازن الحقوق والواجبات لا على القوة. وللقبيلة استبداله إن لم يثبت أهليته.","ص48"],["تحالف بني ياس","قام التحالف على المصالح المشتركة والأعراف، ولم تكن رابطة الدم العامل الوحيد.","ص44"]],
4:[["القرار الحكيم","تُحل الخلافات بالحوار وبسط الحجة، ويُنبذ العنف، وتنتهي محاولات الانفصال بالمصالحة والعودة.","ص38–51"]],
5:[["جاهز؟","راجع ما تعلمته: البيئة والشرف والتحالف والزعامة وإرث الشيخ زايد.","ص23–51"]]};
/* [أدوات] */
const $=id=>document.getElementById(id),app=$("app");
function h(t,a,...k){const e=document.createElement(t);for(const x in a||{})if(x!=="on"&&a[x]!=null)e.setAttribute(x,a[x]);if(a&&a.on)for(const ev in a.on)e.addEventListener(ev,a.on[ev]);k.flat().forEach(c=>e.append(c));return e}
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function clean(s){return s.replace(/[<>"'&`]/g,"").replace(/\s+/g," ").trim()}
function fitBanner(){document.documentElement.style.setProperty("--banner-h",$("banner").offsetHeight+"px")}
addEventListener("resize",fitBanner);
function screen(title,...k){clearInterval(T);app.textContent="";const t=h("h1",{tabindex:"-1"},title);app.append(t,...k);t.focus()}
let T=0,audio=null,AC=null;
/* [الحالة والتخزين] */
let S={v:CONFIG.ver,name:"",sec:"",best:{},m:{},bad:[]},mem=false;
function save(){try{localStorage.setItem("rihla",JSON.stringify(S))}catch(e){mem=true}}
function load(){try{const r=localStorage.getItem("rihla");if(r){const o=JSON.parse(r);if(o.v===CONFIG.ver)return o}}catch(e){mem=true}return null}
/* [الصوت] */
function beep(f){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.15)}catch(e){}}
/* [الشاشات] */
function start(){const old=load();
 const n=h("input",{id:"nm","aria-describedby":"e1",maxlength:60,autocomplete:"off"}),s=h("select",{id:"sc","aria-describedby":"e2"});
 const secs=["اختر الشعبة"];for(let g=10;g<=12;g++)for(let i=1;i<=6;i++)secs.push(g+"/"+i);secs.push("أخرى");
 secs.forEach((x,i)=>s.append(h("option",{value:i?x:""},x)));
 const o=h("input",{id:"ot",maxlength:10,placeholder:"اكتب الشعبة",style:"display:none"});
 const e1=h("div",{id:"e1",role:"alert",class:"err"}),e2=h("div",{id:"e2",role:"alert",class:"err"});
 const go=h("button",{class:"p",disabled:""},"ابدأ الرحلة");
 const val=()=>{const v=clean(n.value);const okN=v.split(" ").filter(Boolean).length>=3&&/^[A-Za-z\u0600-\u06FF ]+$/.test(v)&&v.length<=60;
  const sv=s.value==="أخرى"?clean(o.value):s.value;o.style.display=s.value==="أخرى"?"block":"none";
  e1.textContent=n.value&&!okN?"اكتب الاسم الثلاثي (ثلاث كلمات على الأقل، حروف ومسافات فقط).":"";
  e2.textContent=s.value==="أخرى"&&!sv?"اكتب الشعبة.":"";go.disabled=!(okN&&sv);return[v,sv]};
 [n,s,o].forEach(x=>x.addEventListener("input",val));
 go.addEventListener("click",()=>{const[v,sv]=val();if(go.disabled)return;S={v:CONFIG.ver,name:v,sec:sv,best:{},m:{},bad:[]};save();map()});
 const kids=[h("div",{class:"card"},h("label",{for:"nm"},"الاسم الثلاثي"),n,e1,h("label",{for:"sc"},"الشعبة"),s,o,e2,go)];
 if(old&&old.name)kids.push(h("button",{on:{click:()=>{S=old;map()}}},"متابعة الرحلة: "+old.name));
 if(mem)kids.push(h("p",{},"تنبيه: التخزين غير متاح، سيُحفظ التقدم في الذاكرة فقط."));
 screen("رحلة عبر الزمن ⏳",h("p",{},"بوابة الزمن مفتوحة: تعلّم، ثم تحدَّ، ثم أتقن."),...kids)}
function lvPct(n){const L=CONFIG.levels[n-1];return S.best[n]!=null?Math.round(S.best[n]/(L.pts*L.show)*100):null}
function mastPct(ids){const cs=Object.keys(CONCEPTS).filter(c=>ids.length?Q.some(q=>q.l>0&&ids.includes(q.l)&&q.c.includes(c)):true);
 const ok=cs.filter(c=>{const m=S.m[c];return m&&m.n>0&&m.r/m.n>=CONFIG.mastery/100&&m.r>=1});return cs.length?Math.round(ok.length/cs.length*100):0}
function unlocked(n){if(n===1)return true;if(n===5)return mastPct([1,2,3,4])>=CONFIG.bossGate&&(lvPct(4)||0)>=CONFIG.pass;return(lvPct(n-1)||0)>=CONFIG.pass}
function map(){const k=CONFIG.levels.map(L=>{const u=unlocked(L.n),p=lvPct(L.n);
 return h("button",{disabled:u?null:"",on:{click:()=>lesson(L.n)},"aria-label":"المستوى "+L.n},(u?"▶ ":"🔒 ")+L.n+". "+L.name+(p!=null?" — "+p+"%"+(p>=CONFIG.pass?" ⭐":""):""))});
 if(!unlocked(5)&&unlocked(4)&&S.best[4]!=null)k.push(h("p",{},"لفتح التحدي الأكبر أتقن "+CONFIG.bossGate+"% من مفاهيم المستويات 1–4 (إتقانك الحالي: "+mastPct([1,2,3,4])+"%). أعد المستويات لمراجعة مفاهيمك الضعيفة."));
 k.push(h("button",{on:{click:()=>{if(confirm("إعادة الرحلة من البداية؟")){S.best={};S.m={};S.bad=[];save();map()}}}},"إعادة الرحلة"));
 screen("خريطة الرحلة",h("p",{},S.name+" — "+S.sec),h("div",{class:"bar",role:"progressbar","aria-valuenow":mastPct([1,2,3,4,5]),"aria-valuemin":0,"aria-valuemax":100},h("i",{style:"width:"+mastPct([1,2,3,4,5])+"%"})),h("p",{},"تقدّم الإتقان: "+mastPct([1,2,3,4,5])+"%"),...k)}
/* [المستويات] */
function lesson(n){const cards=LESSONS[n]||[];let i=0;
 const draw=()=>{const c=cards[i];screen("محطة المعرفة – المستوى "+n,h("div",{class:"card"},h("h2",{},c[0]),h("p",{},c[1]),h("small",{},"المرجع: "+c[2])),
  h("button",{class:"p",on:{click:()=>{i++;i<cards.length?draw():run(n)}}},i<cards.length-1?"التالي":"ابدأ التحدي"),h("button",{on:{click:()=>run(n)}},"تخطَّ البطاقات"))};draw()}
let R=null;
function run(n){const L=CONFIG.levels[n-1];let qs=shuf(Q.filter(q=>q.l===n)).slice(0,L.show);
 R={n,qs,i:0,h:CONFIG.hearts,pts:0,res:[]};ask()}
/* [محرك الإتقان] */
function record(q,ok){q.c.forEach(c=>{const m=S.m[c]=S.m[c]||{n:0,r:0,last:[]};m.n++;if(ok)m.r++;m.last=m.last.concat(ok?1:0).slice(-3)});if(!ok)S.bad.push(q.id)}
function ask(){if(R.i>=R.qs.length)return finish();const q=R.qs[R.i],n=R.n;
 let secs=CONFIG.time[n===5?"boss":q.t]*(CONFIG.extraTime?2:1),done=false;
 const fb=h("div",{"aria-live":"polite",class:"card",style:"display:none"}),tm=h("div",{},"");
 const end=(ok,extra)=>{if(done)return;done=true;clearInterval(T);record(q,ok);if(ok)R.pts+=CONFIG.levels[n-1].pts;else R.h--;beep(ok?660:200);
  fb.style.display="block";fb.className="card "+(ok?"good":"wrong");
  fb.append(h("b",{},ok?"✔ إجابة صحيحة":"✘ إجابة غير صحيحة"),h("p",{},(extra?extra+" ":"")+q.e),h("small",{},"المرجع: "+q.s),h("br"),
   h("button",{class:"p",on:{click:()=>{if(R.h<=0){R.pts=0;R.i=0;tryAgain()}else{R.i++;ask()}}}},R.h<=0?"انتهت القلوب":"التالي"));
  app.querySelectorAll("button:not(.p),select").forEach(b=>b.disabled=true);fb.querySelector("button").focus()};
 const body=h("div",{class:"card"},h("p",{},q.x));
 if(q.t==="mcq"||q.t==="scenario"){const ord=shuf(q.o.map((t,i)=>i));ord.forEach((oi,k)=>body.append(h("button",{on:{click:()=>end(oi===q.a,q.f?q.f[oi]:"")}},(k+1)+". "+q.o[oi])))}
 else if(q.t==="tf"){const b=h("div",{});body.append(b);[true,false].forEach(v=>b.append(h("button",{on:{click:()=>{b.textContent="";b.append(h("p",{},"اختر التبرير الصحيح:"));const ord=shuf(q.o.map((t,i)=>i));ord.forEach(oi=>b.append(h("button",{on:{click:()=>end(v===q.v&&oi===q.a,v===q.v?"":"الحكم على العبارة غير صحيح.")}},q.o[oi])))}}},v?"صواب":"خطأ")))}
 else if(q.t==="order"){const pick=[],box=h("p",{},"");const items=shuf(q.i);const bs=items.map(t=>{const b=h("button",{on:{click:()=>{pick.push(t);b.disabled=true;box.textContent="ترتيبك: "+pick.join(" ← ");if(pick.length===items.length)end(pick.every((v,i)=>v===q.i[i]),"الترتيب الصحيح: "+q.i.join(" ← ")+".")}}},t);return b});body.append(box,...bs)}
 else if(q.t==="match"){const rs=shuf(q.p.map(p=>p[1])),sels=q.p.map(p=>{const s=h("select",{"aria-label":p[0]},h("option",{value:""},"اختر"),rs.map(r=>h("option",{value:r},r)));body.append(h("label",{},p[0]),s);return s});
  body.append(h("button",{class:"p",on:{click:()=>end(sels.every((s,i)=>s.value===q.p[i][1]),"الصحيح: "+q.p.map(p=>p[0]+" ← "+p[1]).join("، ")+".")}},"تحقق"))}
 const hint=h("button",{on:{click:e=>{e.target.disabled=true;body.append(h("small",{},"تلميح: "+q.h))}}},"💡 تلميح");
 const tick=()=>{tm.textContent="⏱ "+secs+" ث   ❤ "+R.h;tm.className=secs<=5?"low":""};tick();
 screen("المستوى "+n+" – سؤال "+(R.i+1)+"/"+R.qs.length,tm,body,hint,fb);
 T=setInterval(()=>{secs--;tick();if(secs<=5)beep(880);if(secs<=0)end(false,"انتهى الوقت.")},1000);
 document.addEventListener("keydown",kd);function kd(e){if(!document.body.contains(body)){document.removeEventListener("keydown",kd);return}const b=body.querySelectorAll("button");if(/^[1-4]$/.test(e.key)&&b[e.key-1])b[e.key-1].click()}}
function tryAgain(){save();screen("أعد المحاولة",h("div",{class:"card"},h("p",{},"نفدت القلوب وأُلغيت نقاط هذا المستوى. سيُعاد خلط الأسئلة.")),h("button",{class:"p",on:{click:()=>run(R.n)}},"أعد المحاولة"),h("button",{on:{click:map}},"الخريطة"))}
function finish(){const L=CONFIG.levels[R.n-1],tot=L.pts*L.show;S.best[R.n]=Math.max(S.best[R.n]||0,R.pts);save();const p=Math.round(R.pts/tot*100);
 if(R.n===5)return results();
 screen("نتيجة المستوى "+R.n,h("div",{class:"card"},h("p",{},p+"% ("+R.pts+"/"+tot+")"),h("p",{},p>=CONFIG.pass?"✔ نجحت وفُتح المستوى التالي (أو شرط الإتقان للتحدي الأكبر)":"✘ أعد المستوى لبلوغ "+CONFIG.pass+"%")),h("button",{class:"p",on:{click:map}},"العودة للخريطة"))}
/* [النتائج والمراجعة] */
function total(){let a=0,b=0;CONFIG.levels.forEach(L=>{a+=S.best[L.n]||0;b+=L.pts*L.show});return Math.round(a/b*100)}
function results(){const pct=total(),ms=mastPct([1,2,3,4,5]),pass=pct>=CONFIG.pass&&ms>=CONFIG.mastery;
 const rep=Object.keys(CONCEPTS).map(c=>{const m=S.m[c],st=m&&m.n&&m.r/m.n>=CONFIG.mastery/100&&m.r>=1?"✔ متقَن":m?"◐ قيد التعلّم":"✘ يحتاج مراجعة";return h("li",{},c+" "+CONCEPTS[c]+": "+st)});
 const k=[h("div",{class:"card"},h("p",{},"النسبة: "+pct+"% — الإتقان: "+ms+"%")),h("div",{class:"card"},h("h2",{},"بطاقة تقرير الإتقان"),h("ul",{},rep))];
 if(pass)k.push(h("button",{class:"p",on:{click:cert}},"احصل على شهادتك"));
 else{const weak=Object.keys(CONCEPTS).filter(c=>!(S.m[c]&&S.m[c].n&&S.m[c].r/S.m[c].n>=CONFIG.mastery/100));
  k.push(h("div",{class:"card"},h("h2",{},"خطة العلاج الشخصية"),h("p",{},"حاول مرة أخرى يا بطل. راجع: "+weak.map(c=>CONCEPTS[c]).join("، ")),h("p",{},"الأسئلة التي أخطأت فيها: "+S.bad.map(id=>{const q=Q.find(x=>x.id===id);return q?q.s:""}).filter((v,i,a)=>a.indexOf(v)===i).join(" | ")))),k.push(h("button",{on:{click:map}},"إعادة المستويات الضعيفة"))}
 screen("النتائج",...k);if(pass)beep(880)}
/* [الشهادة] */
function cert(){const d=new Intl.DateTimeFormat("ar",{dateStyle:"long"}).format(new Date());
 screen("الشهادة",h("div",{id:"cert"},h("h3",{},CONFIG.school),h("h2",{},"شهادة إتمام – بطل الدراسات الاجتماعية"),
  h("p",{},"تشهد إدارة المدرسة بأن الطالب/ة: "+S.name+" من الشعبة: "+S.sec+" قد أتمّ/ت بنجاح رحلة عبر الزمن في مادة الدراسات الاجتماعية وحقق/ت نسبة "+total()+"% ونال/ت لقب بطل الدراسات الاجتماعية"),
  h("p",{},d),h("div",{class:"row"},h("span",{},CONFIG.teacher),h("span",{},CONFIG.principal))),
  h("button",{class:"p noprint",on:{click:()=>print()}},"طباعة / حفظ PDF"),h("button",{on:{click:map}},"الخريطة"))}
/* [وضع المعلم] */
function teacher(){const rows=Q.map(q=>h("tr",{},[q.l,q.t,q.c.join(","),q.x,q.t==="mcq"||q.t==="scenario"?q.o[q.a]:q.t==="tf"?(q.v?"صواب":"خطأ")+" / "+q.o[q.a]:q.t==="order"?q.i.join(" ← "):q.p.map(p=>p.join("=")).join("; "),q.h,q.e,q.s].map(v=>h("td",{style:"border:1px solid #888;padding:4px"},String(v)))));
 const cov={};Q.forEach(q=>q.c.forEach(c=>cov[c]=(cov[c]||0)+1));
 screen("وضع المعلم",h("p",{},"عدد الأسئلة: "+Q.length+" — تغطية المفاهيم: "+Object.keys(CONCEPTS).map(c=>c+"="+(cov[c]||0)).join("، ")),h("button",{on:{click:()=>print()}},"طباعة الجدول"),h("div",{style:"overflow-x:auto"},h("table",{style:"font-size:.8rem"},rows)))}
/* [التهيئة] */
function validateQuestions(){const cov={};Q.forEach(q=>{if(!q.s||!q.c||!q.c.length)console.warn("ناقص مرجع/مفهوم:",q.id);q.c.forEach(c=>cov[c]=(cov[c]||0)+1)});Object.keys(CONCEPTS).forEach(c=>{if((cov[c]||0)<3)console.warn("المفهوم "+c+" مغطّى بـ"+(cov[c]||0)+" أسئلة فقط")})}
fitBanner();validateQuestions();
if(/[?&]teacher=1/.test(location.search))teacher();else start();
</script></body></html>
